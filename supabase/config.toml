# Supabase CLI config for the hosted project.
# Generated during handover cleanup. `supabase link --project-ref` targets this.
project_id = "gkjbrfwidybzptvgifxz"

# --- Edge functions ---------------------------------------------------------
# verify_jwt = false on every function on purpose:
#   * admin-* functions authenticate with their own opaque admin-session token
#     (see functions/_shared/admin.ts), not a Supabase JWT.
#   * public endpoints (donations, church-finder, trivia, referrals) must be
#     callable by anonymous visitors.
#   * the project uses the new sb_publishable_ key, which should not be relied
#     on to satisfy gateway JWT verification.
# FOLLOW-UP: per-function hardening for the ones that read by email/userId
# (get-donation-history, get-subscription-status) — see db/README.md.

